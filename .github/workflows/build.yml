name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Run Build and Save Log
        id: build_step
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon --stacktrace > full_build.log 2>&1

      - name: Extract Error to Annotation
        run: |
          grep -B 2 -A 8 "FAILURE: Build failed with an exception." full_build.log > extracted_error.txt || tail -n 25 full_build.log > extracted_error.txt
          while IFS= read -r line; do
            echo "::error title=GradleException::$line"
          done < extracted_error.txt

      - name: Fail if build step failed
        if: steps.build_step.outcome == 'failure'
        run: exit 1

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
