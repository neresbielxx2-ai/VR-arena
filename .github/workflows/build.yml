name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace || true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --info --stacktrace 2>&1 | tee assembleDebug.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== ASSEMBLE DEBUG FAILED ==="
            grep -E -C 3 "(e: |error:|FAILED|FAILURE:)" assembleDebug.log | head -n 80
            exit 1
          fi

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace || true

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} output-apks/ \; || true
          if [ -z "$(ls -A output-apks)" ]; then
            find app/build/ -name "*.apk" -exec cp -v {} output-apks/ \; || true
          fi
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14
