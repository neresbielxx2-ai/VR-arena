name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug & Release APK
        run: |
          gradle assemble --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_assemble.log || {
            tail -n 120 /tmp/gradle_assemble.log
            exit 1
          }

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          echo "Listing all apk files produced:"
          find . -name "*.apk" || true
          find . -name "*.apk" | while read -r apk; do
            if [[ "$apk" != *"output-apks"* ]]; then
              echo "Copying $apk to output-apks/"
              cp -v "$apk" output-apks/
            fi
          done
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14
