name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_build.log || (cat /tmp/gradle_build.log | grep -E -A 10 -B 2 "(e: |error:|FAILURE:)" && exit 1)

      - name: Build Release APK (Unsigned)
        run: gradle :app:assembleRelease --no-daemon --stacktrace || true

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          find . -name "*.apk" | while read -r apk; do
            if [[ "$apk" != *"output-apks"* ]]; then
              echo "Copying $apk"
              cp -v "$apk" output-apks/
            fi
          done
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14
