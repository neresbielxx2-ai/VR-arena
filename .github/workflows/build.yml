name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || true
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -z "$(find app/build/outputs/apk/ -name '*.apk' 2>/dev/null)" ]; then
            echo "::error title=BuildFailed::$(grep -E -m 5 'e: |error: ' /tmp/build.log || tail -n 20 /tmp/build.log)"
            exit 1
          fi

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} output-apks/ \;
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14
