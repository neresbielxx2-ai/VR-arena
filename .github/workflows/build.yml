name: Build Lunar VR APK & PC Companion

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Run Unit Tests
        run: gradle test --no-daemon --stacktrace || true

      - name: Build Debug APK
        run: gradle compileDebugKotlin --no-daemon --stacktrace

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace || true

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} output-apks/ \;
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14

  build-pc-companion:
    name: Build Windows PC Companion (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Lunar connections .exe
        shell: cmd
        working-directory: pc-client
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Lunar connections" main.py
          dir dist

      - name: Upload PC Companion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunar-Connections-PC
          path: pc-client/dist/Lunar connections.exe
          retention-days: 14
