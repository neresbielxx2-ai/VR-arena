name: Build Lunar VR APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK and Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log || true
          ERR_MSG=$(grep -E -m 1 "FAILURE:|e: /|[Ee]rror:" /tmp/build.log || true)
          echo "::error title=BuildFailedDetails::$ERR_MSG"
          tail -n 60 /tmp/build.log

      - name: Copy & Prepare APK Artifacts
        run: |
          mkdir -p output-apks
          find app/build/outputs/ -name "*.apk" -exec cp -v {} output-apks/ \; || true
          ls -la output-apks/

      - name: Upload LunarVR APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarVR-APK
          path: output-apks/*.apk
          retention-days: 14
